# 配置数据库连接信息
spring:
  profiles:
    active: dev
    group:
      dev: local,dev
      prod: local,prod

  application:
    name: expressway-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB # 最大单个文件大小
      max-request-size: 100MB # 最大请求大小（包括所有文件和表单数据）

# mybatis相关配置
mybatis:
  # mapper 配置文件路径
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名扫描包
  type-aliases-package: com.expressway.entity
  # 类型处理器扫描包
  type-handlers-package: com.expressway.handler
  # 其他配置项
  configuration:
    # 开启 SQL 日志打印到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名自动转换, 如：user_name -> userName
    map-underscore-to-camel-case: true

#阿里云OSS
aliyun:
  oss:
    accessKeyId: ${ALIYUN_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET}
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: expressway-system-bucket
    region: cn-beijing

# Python检测服务配置
python:
  detect:
    service:
      url: http://localhost:8000
      ws-url: ws://localhost:8000